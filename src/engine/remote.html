<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>DJ-Bridge</title>
<style>
  :root { --bg: #0b0c0f; --card: #16181d; --raised: #1f2229; --border: #2a2e37; --text: #eef0f3; --muted: #9aa1ad; --accent: #ff8a1f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #glow { position: fixed; inset: 0; z-index: -1; opacity: .35; transition: background .08s; }
  main { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  .pill { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,.45); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  #bpm { font: 700 76px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; text-align: center; margin: 18px 0 12px; }
  .center { text-align: center; margin-bottom: 12px; }
  #lamps { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; }
  #lamps span { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); }
  #alert { display: none; text-align: center; color: #ffb4a8; margin: 6px 0; }
  h2 { font-size: 12px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; margin: 22px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 12px; text-align: left; font-weight: 600; min-height: 50px; }
  button:active { background: var(--raised); }
  button.on { border: 1.5px solid var(--accent); background: rgba(255,138,31,.16); }
  #drop { width: 100%; margin-top: 22px; padding: 22px; text-align: center; font-size: 20px; letter-spacing: .2em; background: #fff; color: #000; border: none; }
  #drop:active { background: var(--accent); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div id="glow"></div>
<main>
  <header><h1>DJ-Bridge</h1></header>
  <div id="bpm">---.-</div>
  <div class="center"><span class="pill" id="phase">…</span></div>
  <div id="lamps"></div>
  <div id="alert"></div>
  <button id="drop" onclick="send('drop')">DROP</button>
  <h2>Scènes</h2><div class="grid" id="presets"></div>
  <h2>Animation</h2><div class="grid" id="motion"></div>
  <h2>Disposition</h2><div class="grid" id="spread"></div>
  <h2>Déclenchement</h2><div class="grid" id="flash"></div>
  <h2>Régisseur</h2><div class="grid" id="director"></div>
</main>
<script>
  const LABELS = {
    motion: ["Auto", "Pulse", "Respiration", "Montée"],
    flash: ["Kicks", "Réactif", "Chaque temps"],
    director: ["Désactivé", "Activé"],
  };
  const base = location.pathname.replace(/\/?$/, "/");
  const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

  // `values` : la valeur envoyée pour chaque bouton (son rang par défaut).
  function buttons(id, labels, selected, action, values = labels.map((_, i) => i)) {
    const box = document.getElementById(id);
    const key = labels.join("|") + "#" + selected;
    if (box.dataset.key === key) return;
    box.dataset.key = key;
    box.replaceChildren(...labels.map((label, i) => {
      const b = document.createElement("button");
      b.textContent = label;
      if (values[i] === selected) b.className = "on";
      b.onclick = () => send(action, values[i]);
      return b;
    }));
  }

  function show(s) {
    document.getElementById("bpm").textContent = s.bpm ? s.bpm.toFixed(1) : "---.-";
    let phase = s.phase;
    if (s.build !== null) phase += ` · ${s.build} %` + (s.drop_beats !== null ? ` · drop dans ${s.drop_beats} t` : "");
    else if (s.bar) phase += ` · mesure ${s.bar}/4`;
    document.getElementById("phase").textContent = phase;
    document.getElementById("glow").style.background = `radial-gradient(circle at 50% 20%, ${rgb(s.color)}, transparent 70%)`;
    document.getElementById("lamps").replaceChildren(...s.lamps.map(c => {
      const dot = document.createElement("span");
      dot.style.background = rgb(c);
      return dot;
    }));
    const alert = s.bridge_lost ? "Bridge injoignable : reconnexion…" : s.input_lost ? "Entrée audio perdue : reconnexion…" : "";
    const box = document.getElementById("alert");
    box.textContent = alert;
    box.style.display = alert ? "block" : "none";
    const presets = document.getElementById("presets");
    if (s.presets.length) buttons("presets", s.presets, s.presets.indexOf(s.preset), "preset");
    else presets.innerHTML = '<span class="empty">Aucune scène : enregistre-les dans la fenêtre du PC.</span>';
    buttons("motion", LABELS.motion, s.motion, "motion");
    buttons("spread", s.spreads.map(p => p[1]), s.spread, "spread", s.spreads.map(p => p[0]));
    buttons("flash", LABELS.flash, s.flash, "flash");
    buttons("director", LABELS.director, s.director ? 1 : 0, "director");
  }

  async function send(action, value) {
    const query = value === undefined ? `action=${action}` : `action=${action}&value=${value}`;
    try { show(await (await fetch(base + "do?" + query, { method: "POST" })).json()); } catch (e) {}
  }

  async function poll() {
    try { show(await (await fetch(base + "state")).json()); } catch (e) {}
    setTimeout(poll, 250);
  }
  poll();
</script>
</body>
</html>
